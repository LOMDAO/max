<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณหวยลาว (สูตรขยับแต้ม)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --success: #15803d;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --danger: #b91c1c;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --accent: #7c3aed;
            --accent-bg: #f3e8ff;
            --accent-border: #ddd6fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 22px;
            letter-spacing: 4px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-weight: 700;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            display: none;
            border-top: 2px dashed var(--border-color);
            padding-top: 18px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .result-card {
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .result-card.up {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
        }

        .result-card.down {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
        }

        .result-title {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .result-card.up .result-title { color: var(--success); }
        .result-card.down .result-title { color: var(--danger); }

        .result-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        .pair-box {
            background-color: var(--accent-bg);
            border: 1px solid var(--accent-border);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .pair-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .pair-values {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 3px;
        }

        .error-msg {
            color: var(--danger);
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>โปรแกรมคำนวณหวยลาว</h1>
        <p>สูตรขยับแต้มเฉพาะตามโครงสร้างกำหนด</p>
    </div>

    <div class="form-group">
        <label>กรอกผลงวดล่าสุด (4 หลัก):</label>
        <input type="text" id="lastResult" placeholder="เช่น 3816" maxlength="4" autocomplete="off" value="3816">
    </div>

    <div class="error-msg" id="errorMsg">กรุณากรอกตัวเลขให้ครบ 4 หลัก</div>

    <button onclick="calculate()">คำนวณผลลัพธ์</button>

    <div class="result-container" id="resultArea" style="display: block;">
        <div class="section-title">ผลการคำนวณ (4 ชุดตรงตามสูตร)</div>

        <div class="result-grid">
            <div class="result-card down">
                <div class="result-title">ล่าง ลด 1 แต้ม</div>
                <div class="result-value" id="botMinus">28</div>
            </div>
            <div class="result-card up">
                <div class="result-title">ล่าง เพิ่ม 1 แต้ม</div>
                <div class="result-value" id="botPlus">39</div>
            </div>
        </div>

        <div class="result-grid">
            <div class="result-card down">
                <div class="result-title">บน ลด 1 แต้ม</div>
                <div class="result-value" id="topMinus">15</div>
            </div>
            <div class="result-card up">
                <div class="result-title">บน เพิ่ม 1 แต้ม</div>
                <div class="result-value" id="topPlus">17</div>
            </div>
        </div>

        <div class="pair-box">
            <div class="pair-title">🔥 ผลลัพธ์สุทธิ (4 ชุดตรง)</div>
            <div class="pair-values" id="valPairs">28 | 39 | 15 | 17</div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const input = document.getElementById('lastResult').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultArea = document.getElementById('resultArea');

        errorMsg.style.display = 'none';

        if (input.length !== 4 || !/^\d+$/.test(input)) {
            errorMsg.style.display = 'block';
            resultArea.style.display = 'none';
            return;
        }

        // แยกเลขล่าง (หลัก 1-2) และเลขบน (หลัก 3-4)
        const d1 = parseInt(input[0], 10);
        const d2 = parseInt(input[1], 10);
        const d3 = parseInt(input[2], 10);
        const d4 = parseInt(input[3], 10);

        const botNum = parseInt(input.substring(0, 2), 10);
        const topNum = parseInt(input.substring(2, 4), 10);

        // 1. ล่างลด: ขยับเฉพาะหลักสิบลง 1 แต้ม (38 -> 28)
        const botMinusVal = ((d1 - 1 + 10) % 10).toString() + d2.toString();

        // 2. ล่างเพิ่ม: เพิ่มค่ารวม +1 (38 -> 39)
        const botPlusVal = ((botNum + 1) % 100).toString().padStart(2, '0');

        // 3. บนลด: ลบค่ารวม -1 (16 -> 15)
        const topMinusVal = ((topNum - 1 + 100) % 100).toString().padStart(2, '0');

        // 4. บนเพิ่ม: เพิ่มค่ารวม +1 (16 -> 17)
        const topPlusVal = ((topNum + 1) % 100).toString().padStart(2, '0');

        // แสดงผลลัพธ์
        document.getElementById('botMinus').innerText = botMinusVal;
        document.getElementById('botPlus').innerText = botPlusVal;
        document.getElementById('topMinus').innerText = topMinusVal;
        document.getElementById('topPlus').innerText = topPlusVal;

        document.getElementById('valPairs').innerText = `${botMinusVal} | ${botPlusVal} | ${topMinusVal} | ${topPlusPlusVal = topPlusVal}`;

        resultArea.style.display = 'block';
    }

    calculate();
</script>

</body>
</html>
